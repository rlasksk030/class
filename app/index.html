<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; script-src 'self'; style-src 'self'; connect-src https://open.neis.go.kr https://api.open-meteo.com https://air-quality-api.open-meteo.com https://nominatim.openstreetmap.org"><title>우리 교실</title><link rel="stylesheet" href="ui/tokens.css"><link rel="stylesheet" href="ui/components.css"><link rel="stylesheet" href="ui/icons.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="extras.css"><link rel="stylesheet" href="okgu.css"><link rel="stylesheet" href="random-picker.css"><link rel="stylesheet" href="activity.css"><link rel="stylesheet" href="diary.css"><link rel="stylesheet" href="board-titles.css"><link rel="stylesheet" href="backup.css"><link rel="stylesheet" href="layout.css"><link rel="stylesheet" href="design.css"></head><body>
<header><div class="head-id"><div class="eyebrow">우리 교실 · 함께 여는 하루</div><h1 id="classTitle">우리 교실</h1><p id="date"></p></div><section class="card weather"><div class="eyebrow">지금 우리 동네</div><div id="weather"><p class="status">날씨를 확인하고 있습니다</p></div></section><div class="headerRight"><time id="clock"></time><div id="nowPeriod" class="now-period" aria-live="off"></div></div></header>
<main><section class="card morning uc-card uc-card--green"><div class="cardhead"><h2><span class="uc-ico uc-ico--morning-sun board-icon" aria-hidden="true"></span>아침활동</h2><button data-edit="morning" class="uc-card__edit">수정</button></div><div id="morning" class="prose"></div></section>
<section class="card timetable uc-card uc-card--blue"><div class="cardhead"><h2>오늘 시간표</h2><button data-edit="timetable" class="uc-card__edit">수정</button></div><div id="timetable"></div><p id="timetableStatus" class="status"></p></section>

<section class="card notices uc-card uc-card--yellow"><div class="cardhead"><h2><span class="uc-ico uc-ico--notice-star board-icon" aria-hidden="true"></span>안내사항</h2><button data-edit="notices" class="uc-card__edit">작성</button></div><div id="notices" class="prose"></div></section>
<section class="card meal uc-card uc-card--pink"><div class="cardhead"><h2>오늘의 급식</h2><button data-edit="meal" class="uc-card__edit">수정</button></div><div id="meal" class="prose"></div><p id="mealStatus" class="status"></p></section></main>
<footer><span class="source-app">우리 교실 · <span id="globalStatus">자동으로 채워지는 우리 반의 하루</span></span><span><span id="weatherSource"></span>학교 정보 · NEIS / 날씨 · Open-Meteo / 지도 · © OpenStreetMap</span></footer><nav class="app-bar uc-bar" aria-label="도구"><div class="app-bar__side app-bar__left"></div><div class="app-bar__center"></div><div class="app-bar__side app-bar__right"><button id="fullscreen" type="button" class="uc-tool"><span class="uc-ico uc-ico--fullscreen" aria-hidden="true"></span><span class="uc-tool__label">전체 화면</span></button><button id="refresh" type="button" class="uc-tool"><span class="uc-ico uc-ico--refresh" aria-hidden="true"></span><span class="uc-tool__label">새로고침</span></button><button id="settings" type="button" class="uc-tool"><span class="uc-ico uc-ico--settings" aria-hidden="true"></span><span class="uc-tool__label">설정</span></button></div></nav>
<dialog id="editDialog"><form id="editForm"><div class="dialog-head"><h2 id="editTitle"></h2><button type="button" class="uc-icon-btn dialog-close" data-close="editDialog" aria-label="닫기" title="닫기"><span class="uc-ico uc-ico--close" aria-hidden="true"></span></button></div><p id="editHelp" class="dialog-desc"></p><div class="edit-tools"><span id="editHint" class="edit-hint"></span></div><div id="timetableRows" class="timetable-rows" hidden></div><p id="timetableNote" class="edit-note" hidden>비워 둔 교시는 대시보드에 나오지 않습니다.</p><textarea id="editText" rows="9"></textarea><div class="actions"><button type="button" id="restore" class="uc-btn--ghost">원래대로 되돌리기</button><button type="button" data-close="editDialog">취소</button><button class="primary">저장</button></div></form></dialog>
<dialog id="settingsDialog"><form id="settingsForm"><div class="eyebrow">옥구초등학교</div><h2>우리 교실 설정</h2><p>학년과 반을 한 번만 선택해 주세요.</p><div class="fields"><label>학년<select id="grade" required><option value="">학년 선택</option><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option><option value="4">4학년</option><option value="5">5학년</option><option value="6">6학년</option></select></label><label>반<input id="classroom" type="number" min="1" max="99" list="classOptions" required><datalist id="classOptions"></datalist></label></div><p id="classInfoStatus" role="status"></p><div class="actions"><button type="button" data-close="settingsDialog">닫기</button><button class="primary">설정 저장</button></div></form></dialog>
<script src="core.js"></script><script src="school.js"></script><script src="app.js"></script><script src="resize.js"></script><script src="layout-core.js"></script><script src="layout-ui.js"></script><script src="extras-core.js"></script><script src="photos.js"></script><script src="whiteboard-objects.js"></script><script src="class-roster.js"></script><script src="random-picker.js"></script><script src="activity.js"></script><script src="diary.js"></script><script src="extras.js"></script><script src="screen-lock.js"></script><script src="desktop-ui.js"></script><script src="updates-ui.js"></script><script src="board-titles.js"></script><script src="backup-core.js"></script><script src="backup-ui.js"></script><script src="settings-shell.js"></script><script src="design.js"></script></body></html>
