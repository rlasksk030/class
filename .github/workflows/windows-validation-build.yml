# Windows validation build (not a release).
# Builds the NSIS installer from this development branch and keeps it only as a workflow artifact.
# It never publishes: no tag, no GitHub Release, no public latest.yml, so installed apps see no update.
# The teacher-facing artifact is uploaded only after the real-installer update scenarios pass.
name: Windows 검증용 설치 파일

on:
  push:
    branches: [feature/class-dashboard-v1.8.2-windows-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      - name: npm run check
        run: npm run check
      - name: npm test
        run: npm test
      - name: npm run test:e2e
        run: npm run test:e2e
      - name: npm run dist:win
        run: npm run dist:win
      - name: Verify installer
        shell: pwsh
        run: |
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $setup = "dist/classroom-dashboard-setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Installer not found: $setup" }
          if (-not (Select-String -Path dist/latest.yml -Pattern "^version: $version$" -Quiet)) { throw "latest.yml version mismatch" }
          $files = @($setup, "$setup.blockmap", "dist/latest.yml")
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $files out/
          Get-ChildItem out | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out/SHA256SUMS.txt -Encoding utf8
          @(
            "우리 교실 v$version Windows 검증용 설치 파일"
            "브랜치: $env:GITHUB_REF_NAME"
            "커밋: $env:GITHUB_SHA"
            "빌드: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            ""
            "검증 전용입니다. GitHub Release에 올리거나 latest.yml을 공개하지 마세요."
            "latest.yml은 기록용이며 설치할 때는 classroom-dashboard-setup-$version.exe만 실행합니다."
          ) | Set-Content out/README-검증용.txt -Encoding utf8
          Get-ChildItem out | Format-Table Name, Length
      - name: Keep build for the installer scenarios (internal)
        uses: actions/upload-artifact@v4
        with:
          name: internal-build
          path: out/
          if-no-files-found: error
          retention-days: 3
      - name: Upload test output (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-for-debugging
          path: tests/e2e/.out/shots/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  # Real installers on a clean Windows VM (see tests/windows/installer-scenario.cjs for scenarios A-E).
  installer-scenarios:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scenario: [A, B, C, D, E, F]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: internal-build
          path: build-out
      - name: Get published v1.7.8 and v1.8.1 installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force setups | Out-Null
          foreach ($v in @('1.7.8','1.8.1')) { Invoke-WebRequest "https://github.com/rlasksk030/class/releases/download/v$v/classroom-dashboard-setup-$v.exe" -OutFile "setups/setup-$v.exe" }
          $new = Get-ChildItem build-out -Filter 'classroom-dashboard-setup-*.exe' | Select-Object -First 1
          Copy-Item $new.FullName setups/setup-new.exe
          Get-ChildItem setups | Format-Table Name, Length
      - name: Scenario ${{ matrix.scenario }}
        run: node tests/windows/installer-scenario.cjs ${{ matrix.scenario }} setups
      - name: Diagnose script (read-only) + backup copy
        if: always()
        # The step itself runs in pwsh (UTF-8); the script runs in Windows PowerShell 5.1 like on a school PC.
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/windows/classroom-diagnose.ps1 -Backup
          New-Item -ItemType Directory -Force tests/windows/.out | Out-Null
          Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter *.txt | Copy-Item -Destination tests/windows/.out/
          Get-ChildItem ([Environment]::GetFolderPath('MyDocuments')) -Directory | Get-ChildItem -Recurse | Select-Object -First 20 | ForEach-Object { $_.FullName }
      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-scenario-report-${{ matrix.scenario }}
          path: tests/windows/.out/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  validation-artifact:
    needs: [build, installer-scenarios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: internal-build
          path: out
      - name: Upload validation installer
        uses: actions/upload-artifact@v4
        with:
          name: 2026-09-30_우리교실_v1.8.2_Windows검증용
          path: out/
          if-no-files-found: error
          retention-days: 30
