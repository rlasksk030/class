name: Timer PIP v1.8.10 release
on:
  push:
    branches: [release/timer-pip-20261105]
    paths: [.github/workflows/timer-pip-release.yml]
permissions:
  contents: read
concurrency:
  group: timer-pip-v1810-release
  cancel-in-progress: false
env:
  NATIONAL_SHA: 960f2c06f218bbd3a32cc55a1f0d535fb1817408
  OKGU_SHA: 1c03b1124aaacef59db6f437b159ed9e9bab265c
  GH_REPO: rlasksk030/class
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: nationwide
            runner: ubuntu-latest
            reuse: true
            sha: 960f2c06f218bbd3a32cc55a1f0d535fb1817408
            tag: timer-pip-nationwide-v1.8.10
            installer: classroom-dashboard-nationwide-setup-1.8.10-x64.exe
            manifest: nationwide.yml
          - edition: okgu
            runner: windows-2022
            reuse: false
            sha: 1c03b1124aaacef59db6f437b159ed9e9bab265c
            tag: v1.8.10
            installer: classroom-dashboard-setup-1.8.10.exe
            manifest: latest.yml
    env:
      SOURCE_SHA: ${{ matrix.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse the successful immutable nationwide build
        if: ${{ matrix.reuse }}
        working-directory: source
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          result=$(curl --fail --silent --show-error https://api.github.com/repos/rlasksk030/class/actions/jobs/127068511628 | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>process.stdout.write(JSON.parse(s).conclusion||''))")
          test "$result" = success
          gh release download timer-pip-nationwide-v1.8.10 --pattern '*.exe' --pattern '*.blockmap' --pattern nationwide.yml --pattern release-artifacts.json --dir dist
          node ../driver/.github/release/verify.cjs nationwide dist download
      - name: Install locked dependencies without Actions cache
        if: ${{ !matrix.reuse }}
        working-directory: source
        run: npm ci --no-audit --no-fund
      - name: Syntax, unit and complete Electron regression tests
        if: ${{ !matrix.reuse }}
        working-directory: source
        shell: pwsh
        run: |
          npm run check 2>&1 | Tee-Object check.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test 2>&1 | Tee-Object unit.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node ../driver/.github/release/e2e.cjs 2>&1 | Tee-Object e2e.log
          exit $LASTEXITCODE
      - name: Build native x64 NSIS installer once
        if: ${{ !matrix.reuse }}
        working-directory: source
        run: npm run dist:win
      - name: Verify packaged source and update manifest
        if: ${{ !matrix.reuse }}
        working-directory: source
        run: node ../driver/.github/release/verify.cjs ${{ matrix.edition }}
      - name: Stage candidate privately as draft release
        if: ${{ !matrix.reuse }}
        working-directory: source
        shell: pwsh
        run: |
          @('PENDING Windows installer gates. Do not publish manually.', "Source: $env:SOURCE_SHA", "Run: https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID") | Set-Content pending.md -Encoding utf8
          gh release create '${{ matrix.tag }}' --draft --target '${{ matrix.sha }}' --title '우리 교실 ${{ matrix.edition }} v1.8.10' --notes-file pending.md 'dist/${{ matrix.installer }}' 'dist/${{ matrix.installer }}.blockmap' 'dist/${{ matrix.manifest }}' dist/release-artifacts.json check.log unit.log e2e.log
          exit $LASTEXITCODE

  installer:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario: [A, B, C, D, E, F, G, H, I]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OKGU_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download staged candidate and original installer baselines
        shell: pwsh
        run: |
          New-Item -ItemType Directory setups | Out-Null
          gh release download v1.8.10 --pattern 'classroom-dashboard-setup-1.8.10.exe' --dir setups
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Rename-Item setups/classroom-dashboard-setup-1.8.10.exe setup-new.exe
          foreach ($v in @('1.7.8','1.8.1','1.8.4')) { Invoke-WebRequest "https://github.com/rlasksk030/class/releases/download/v$v/classroom-dashboard-setup-$v.exe" -OutFile "setups/setup-$v.exe" }
          if ((Get-FileHash setups/setup-1.8.4.exe -Algorithm SHA256).Hash.ToLower() -ne 'f72232b8e64c6840da2cca19606ee94c6c04280894ee40e733a58918a0c90d71') { throw 'Baseline hash mismatch' }
      - name: Original installer scenario ${{ matrix.scenario }}
        shell: pwsh
        run: |
          node tests/windows/installer-scenario.cjs '${{ matrix.scenario }}' setups 2>&1 | Tee-Object 'installer-${{ matrix.scenario }}.log'
          exit $LASTEXITCODE
      - name: Diagnose and preserve synthetic reports without Actions artifacts
        if: always()
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/windows/classroom-diagnose.ps1 -Backup
          if (Test-Path 'installer-${{ matrix.scenario }}.log') { gh release upload v1.8.10 'installer-${{ matrix.scenario }}.log' }
          if (Test-Path 'tests/windows/.out/report-${{ matrix.scenario }}.json') { gh release upload v1.8.10 'tests/windows/.out/report-${{ matrix.scenario }}.json' }

  upgrade:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: nationwide
            tag: timer-pip-nationwide-v1.8.10
            previous: https://raw.githubusercontent.com/rlasksk030/class/cf0604e68f6afbf5160b9168f3861b7bb56466ac/classroom-dashboard-nationwide-setup-1.8.9-x64.exe
            digest: 86ceba98741d77e9eb45a660c4d252ae42cc21f9ab463f2bea26d71b52c39ff1
          - edition: okgu
            tag: v1.8.10
            previous: https://github.com/rlasksk030/class/releases/download/v1.8.7/classroom-dashboard-setup-1.8.7.exe
            digest: ffbcd03caf69a63f0b77f0dca164f34b05607dfa568a97ccd7ee33dfe1b81741
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download candidate and verified previous edition
        shell: pwsh
        run: |
          gh release download '${{ matrix.tag }}' --pattern '*.exe' --dir fixtures
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-WebRequest '${{ matrix.previous }}' -OutFile fixtures/previous.exe
          if ((Get-FileHash fixtures/previous.exe -Algorithm SHA256).Hash.ToLower() -ne '${{ matrix.digest }}') { throw 'Previous installer hash mismatch' }
      - name: Same-folder data preservation and packaged timer PIP
        shell: pwsh
        run: |
          node .github/release/upgrade.cjs '${{ matrix.edition }}' fixtures 2>&1 | Tee-Object 'upgrade-${{ matrix.edition }}.log'
          exit $LASTEXITCODE
      - name: Preserve upgrade evidence
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'upgrade-${{ matrix.edition }}.log') { gh release upload '${{ matrix.tag }}' 'upgrade-${{ matrix.edition }}.log' }

  channels:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLASSROOM_DISPOSABLE_VM: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download both candidates and verified legacy baseline
        shell: pwsh
        run: |
          gh release download timer-pip-nationwide-v1.8.10 --pattern '*.exe' --pattern nationwide.yml --dir fixtures
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release download v1.8.10 --pattern '*.exe' --dir fixtures
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-WebRequest https://github.com/rlasksk030/class/releases/download/v1.8.7/classroom-dashboard-setup-1.8.7.exe -OutFile fixtures/previous.exe
      - name: Existing channel regression plus new Okgu candidate
        shell: pwsh
        run: |
          node .github/release/channels.cjs fixtures 2>&1 | Tee-Object channels.log
          exit $LASTEXITCODE
      - name: Preserve update channel evidence
        if: always()
        shell: pwsh
        run: |
          if (Test-Path channels.log) { gh release upload timer-pip-nationwide-v1.8.10 channels.log }

  publish:
    needs: [build, installer, upgrade, channels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: downloads/nationwide
          path: feed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: driver
      - name: Publish only the validated installers to their existing channels
        working-directory: driver
        run: node .github/release/publish.cjs
